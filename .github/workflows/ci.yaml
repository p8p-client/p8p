name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-cs-fixer:
    name: PHP CS Fixer (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        symfony-version: ['8.0.*']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer all config allow-plugins.symfony/flex true
          composer all require --no-progress --no-scripts symfony/flex
          composer all config extra.symfony.require "${{ matrix.symfony-version }}"
          composer all upgrade --prefer-dist --no-progress

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHPStan (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        symfony-version: [ '8.0.*' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer all config allow-plugins.symfony/flex true
          composer all require --no-progress --no-scripts symfony/flex
          composer all config extra.symfony.require "${{ matrix.symfony-version }}"
          composer all upgrade --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  rector:
    name: Rector (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        symfony-version: ['8.0.*']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer all config allow-plugins.symfony/flex true
          composer all require --no-progress --no-scripts symfony/flex
          composer all config extra.symfony.require "${{ matrix.symfony-version }}"
          composer all upgrade --prefer-dist --no-progress

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  tests:
    name: Tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        symfony-version: [ '7.4.*', '8.0.*' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer all config allow-plugins.symfony/flex true
          composer all require --no-progress --no-scripts symfony/flex
          composer all config extra.symfony.require "${{ matrix.symfony-version }}"
          composer all upgrade --prefer-dist --no-progress

      - name: Run Client tests
        run: cd src/Client && vendor/bin/phpunit

      - name: Run CodeGenerator tests
        run: cd src/CodeGenerator && vendor/bin/phpunit

  functional-tests:
    name: Functional Tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }} and K3S ${{ matrix.k3s-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        symfony-version: [ '7.4.*', '8.0.*' ]
        k3s-version: ['v1.34.1-k3s1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer all config allow-plugins.symfony/flex true
          composer all require --no-progress --no-scripts symfony/flex
          composer all config extra.symfony.require "${{ matrix.symfony-version }}"
          composer all upgrade --prefer-dist --no-progress

      - name: Setup K3s
        uses: debianmaster/actions-k3s@v1.0.5
        with:
          version: ${{ matrix.k3s-version }}

      - name: Wait for K3s to be ready
        run: |
          kubectl wait --for=condition=ready node --all --timeout=60s
          kubectl cluster-info

      - name: Start kubectl proxy
        run: |
          kubectl proxy --port=8001 &
          sleep 5
          curl -s http://127.0.0.1:8001/api/v1/namespaces || (echo "Proxy not ready" && exit 1)

      - name: Run SDK functional tests
        env:
          KUBERNETES_API_URL: http://127.0.0.1:8001
          KUBERNETES_NAMESPACE: default
        run: cd src/Sdk && vendor/bin/phpunit